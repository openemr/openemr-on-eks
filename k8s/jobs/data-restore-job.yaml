# OpenEMR application data restore Job
# Placeholders substituted by restore.sh before apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: openemr-data-restore
  namespace: ${NAMESPACE}
  annotations:
    checkov.io/skip1: "CKV_K8S_15=The restore image uses the pinned OpenEMR version rendered from versions.yaml."
    checkov.io/skip2: "CKV_K8S_22=The short-lived restore job installs AWS CLI and writes only temporary and EFS restore data."
    checkov.io/skip3: "CKV_K8S_23=UID 0 is required for package installation and EFS restore writes."
    checkov.io/skip4: "CKV_K8S_38=The projected service-account token is required for IRSA access to the backup S3 bucket."
    checkov.io/skip5: "CKV_K8S_40=The root restore process is short-lived and constrained by seccomp, NetworkPolicy, no privilege escalation, and no Linux capabilities."
    checkov.io/skip6: "CKV_K8S_43=Central version management uses a validated immutable OpenEMR release tag."
  labels:
    app: openemr
    component: data-restore
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: openemr
        component: data-restore
    spec:
      serviceAccountName: openemr-sa
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: restore
          image: openemr/openemr:${OPENEMR_VERSION}
          command: ["/bin/sh", "/scripts/data-restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "${MEMORY_REQUEST}"
              cpu: "${CPU_REQUEST}"
            limits:
              memory: "${MEMORY_LIMIT}"
              cpu: "${CPU_LIMIT}"
          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: BACKUP_BUCKET
              value: "${BACKUP_BUCKET}"
            - name: APP_DATA_KEY
              value: "${APP_DATA_KEY}"
            - name: TIMESTAMP
              value: "${TIMESTAMP}"
            - name: OPENEMR_VERSION
              value: "${OPENEMR_VERSION}"
            - name: DB_ENDPOINT
              value: "${DB_ENDPOINT}"
            - name: DB_USER
              value: "${DB_USER}"
            - name: DB_PASS
              value: "${DB_PASS}"
            - name: DB_NAME
              value: "${DB_NAME}"
          volumeMounts:
            - name: efs-volume
              mountPath: /mnt/efs
            - name: restore-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: efs-volume
          persistentVolumeClaim:
            claimName: openemr-sites-pvc
        - name: restore-script
          configMap:
            name: openemr-data-restore-script
            defaultMode: 0755
