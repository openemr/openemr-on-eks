# =============================================================================
# Credential Rotation CronJob
# =============================================================================
# Scheduled credential rotation running monthly at 03:00 UTC on the 1st.
# The rotation is idempotent and self-healing, so frequent runs are safe.
#
# To disable scheduled rotation, delete this CronJob or set suspend: true.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: credential-rotation
  namespace: openemr
  annotations:
    checkov.io/skip1: "CKV_K8S_14=The deployment script renders CREDENTIAL_ROTATION_IMAGE to a pinned ECR image tag."
    checkov.io/skip2: "CKV_K8S_23=Rotation needs UID 0 to atomically replace the root-owned EFS sqlconf.php file."
    checkov.io/skip3: "CKV_K8S_25=Only CHOWN, FOWNER, and DAC_OVERRIDE are restored after dropping ALL capabilities."
    checkov.io/skip4: "CKV_K8S_38=The projected service-account token is required for IRSA and Kubernetes API updates."
    checkov.io/skip5: "CKV_K8S_40=Root is constrained by a read-only root filesystem, seccomp, least capabilities, RBAC, and NetworkPolicy."
    checkov.io/skip6: "CKV_K8S_43=The image is built and pinned by the deployment workflow; digest rollout is tracked separately."
  labels:
    app: credential-rotation
    component: security
spec:
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  suspend: true
  jobTemplate:
    metadata:
      labels:
        app: credential-rotation
        component: security
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: credential-rotation
            component: security
        spec:
          serviceAccountName: credential-rotation-sa
          restartPolicy: Never

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: credential-rotation
              image: "${CREDENTIAL_ROTATION_IMAGE}"
              args: ["--log-json"]

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]

              env:
                - name: AWS_REGION
                  value: "${AWS_REGION}"
                - name: RDS_SLOT_SECRET_ID
                  value: "${RDS_SLOT_SECRET_ARN}"
                - name: RDS_ADMIN_SECRET_ID
                  value: "${RDS_ADMIN_SECRET_ARN}"
                - name: OPENEMR_SITES_MOUNT_ROOT
                  value: "/mnt/openemr-sites"
                - name: K8S_NAMESPACE
                  value: "openemr"
                - name: K8S_DEPLOYMENT_NAME
                  value: "openemr"
                - name: K8S_SECRET_NAME
                  value: "openemr-db-credentials"
                - name: OPENEMR_HEALTHCHECK_URL
                  value: "${OPENEMR_HEALTHCHECK_URL}"

              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

              volumeMounts:
                - name: openemr-sites
                  mountPath: /mnt/openemr-sites
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: openemr-sites
              persistentVolumeClaim:
                claimName: openemr-sites-pvc
            - name: tmp
              emptyDir: {}

          tolerations:
            - key: "eks.amazonaws.com/compute-type"
              operator: "Equal"
              value: "auto-mode"
              effect: "NoSchedule"
