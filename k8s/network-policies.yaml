# =============================================================================
# OpenEMR Network Security Policies
# =============================================================================
# This file defines Kubernetes Network Policies for OpenEMR security.
#
# Network Security Strategy:
# - Least privilege network access
# - Segregation between namespaces
# - Allow only necessary traffic flows
# - Protect against lateral movement
# =============================================================================

# Monitoring Network Policy
# Allows monitoring systems to access OpenEMR pods for metrics collection
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openemr-monitoring-network-policy
  namespace: openemr
  labels:
    app: openemr
    component: security
spec:
  podSelector:
    matchLabels:
      app: openemr  # Apply to OpenEMR pods
  policyTypes:
  - Ingress         # Only ingress rules (no egress rules)
  ingress:
  # Allow access from OpenEMR namespace (internal communication)
  - from:
    - namespaceSelector:
        matchLabels:
          name: openemr
    - podSelector: {}  # Any pod in the openemr namespace
    ports:
    - protocol: TCP
      port: 80   # HTTP port for health checks
    - protocol: TCP
      port: 443  # HTTPS port for secure communication

  # Allow access from system namespaces for monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system  # Kubernetes system pods
    - namespaceSelector:
        matchLabels:
          name: monitoring   # Monitoring namespace (Prometheus, etc.)
---
# Inter-Namespace Communication Policy
# Allows communication within the OpenEMR namespace and with external load balancers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openemr-inter-namespace-network-policy
  namespace: openemr
  labels:
    app: openemr
    component: security
spec:
  podSelector:
    matchLabels:
      app: openemr  # Apply to OpenEMR pods
  policyTypes:
  - Ingress  # Only ingress rules
  ingress:
  # Allow communication within the OpenEMR namespace
  # This enables pod-to-pod communication for load balancing and health checks
  - from:
    - namespaceSelector:
        matchLabels:
          name: openemr
    ports:
    - protocol: TCP
      port: 80   # HTTP port for internal communication
    - protocol: TCP
      port: 443  # HTTPS port for secure internal communication

---
# Base Access Network Policy
# Defines fundamental ingress and egress rules for OpenEMR operation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openemr-base-access
  namespace: openemr
  labels:
    app: openemr
    component: security
spec:
  podSelector:
    matchLabels:
      app: openemr  # Apply to OpenEMR pods
  policyTypes:
  - Ingress # Ingress rules for incoming traffic
  - Egress  # Egress rules for outgoing traffic

  # Ingress Rules (Incoming Traffic)
  ingress:
  # Allow external access from load balancers and ingress controllers
  # Auto Mode ALB traffic reaches pod IPs from VPC addresses rather than from
  # a Kubernetes namespace, so an ipBlock rule is required.
  - from:
    - namespaceSelector: {}  # Allow in-cluster callers
    - ipBlock:
        cidr: ${VPC_CIDR}    # Restrict ALB-originated traffic to the deployment VPC
    ports:
    - protocol: TCP
      port: 80   # HTTP port for user access
    - protocol: TCP
      port: 443  # HTTPS port for secure user access

  # Egress Rules (Outgoing Traffic)
  egress:
  # Database Access
  # Allow connections to Aurora MySQL database
  - to: []  # Allow to any destination (Aurora is external to cluster)
    ports:
    - protocol: TCP
      port: 3306  # MySQL port

  # Redis Access
  # Allow connections to ElastiCache Redis cluster
  - to: []  # Allow to any destination (Redis is external to cluster)
    ports:
    - protocol: TCP
      port: 6379  # Redis port

  # Monitoring Namespace Access
  # Allow Fluent Bit to send logs to Loki and traces to Tempo
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 80    # Loki gateway HTTP port
    - protocol: TCP
      port: 4318  # Tempo OTLP HTTP port
    - protocol: TCP
      port: 4317  # Tempo OTLP gRPC port (if needed)

  # DNS Resolution
  # Allow DNS queries for service discovery and external lookups
  - to: []  # Allow to any destination (DNS servers)
    ports:
    - protocol: UDP
      port: 53    # DNS port

  # External HTTPS Access
  # Allow HTTPS connections for certificate downloads, updates, etc.
  - to: []  # Allow to any destination (external HTTPS services)
    ports:
    - protocol: TCP
      port: 443   # HTTPS port
---
# Credential Rotation Egress Policy
# Rotation needs RDS, Kubernetes/AWS APIs, DNS, and the OpenEMR health endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: credential-rotation-egress
  namespace: openemr
  labels:
    app: credential-rotation
    component: security
spec:
  podSelector:
    matchLabels:
      app: credential-rotation
  policyTypes:
  - Egress
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 3306
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# SSL Renewal Isolation Policy
# Certificate generation is local to the pod and its EFS volume.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-renewal-deny-network
  namespace: openemr
  labels:
    app: ssl-cert-renewal
    component: security
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - ssl-cert-renewal
      - ssl-cert-renewal-test
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
# Warp Import Egress Policy
# Import jobs need RDS, S3/package repositories, and DNS, but no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warp-import-egress
  namespace: openemr
  labels:
    app: warp
    component: security
spec:
  podSelector:
    matchLabels:
      app: warp
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 3306
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
