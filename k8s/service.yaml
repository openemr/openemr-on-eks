# =============================================================================
# OpenEMR Internal Service Configuration
# =============================================================================
# This service is the backend for the EKS Auto Mode ALB Ingress.
# The ALB registers pod IPs directly and terminates public HTTP/HTTPS traffic.
#
# Keeping the Service internal avoids provisioning a redundant NLB.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: openemr-service
  namespace: openemr
  labels:
    app: openemr
    component: backend
spec:
  type: ClusterIP
  ports:
  # HTTP Port 80
  # Used for health checks, internal communication, and HTTP redirects
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

  # HTTPS Port 443
  # The ALB uses HTTPS for encrypted traffic to the OpenEMR pods.
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP

  selector:
    app: openemr  # Route traffic to OpenEMR pods
