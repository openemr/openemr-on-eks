# Python project CI profiles — maps packages to toolchains and requirement files
python_projects:
  openemr_dr:
    path: scripts/openemr_dr
    requirements_dev: scripts/requirements/openemr-dr-dev.txt
    venv: scripts/.venv-openemr-dr
    coverage_min: 90
    tools: [ruff, mypy, bandit, pytest]
  warp:
    path: warp
    requirements: warp/requirements.txt
    requirements_dev: scripts/requirements/warp-dev.txt
    venv: warp/.venv
    coverage_min: 90
    tools: [black, flake8, mypy, bandit, pytest]
  credential_rotation:
    path: tools/credential-rotation
    requirements: tools/credential-rotation/requirements.txt
    requirements_dev: scripts/requirements/credential-rotation-dev.txt
    venv: tools/credential-rotation/.venv
    coverage_min: 90
    tools: [black, flake8, mypy, bandit, pytest]
  knowledge_mcp:
    path: tools/codebase-mcp
    requirements_dev: tools/codebase-mcp/pyproject.toml
    venv: tools/codebase-mcp/.venv
    coverage_min: 90
    tools: [ruff, mypy, bandit, pytest]

