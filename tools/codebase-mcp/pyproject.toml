[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openemr-eks-mcp"
version = "0.1.0"
description = "Strictly read-only local knowledge MCP server for OpenEMR on EKS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenEMR on EKS contributors" }]
keywords = ["mcp", "openemr", "eks", "knowledge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "fastmcp==3.4.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
openemr-eks-mcp = "openemr_eks_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openemr_eks_mcp"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=openemr_eks_mcp",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openemr_eks_mcp"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["openemr_eks_mcp"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
